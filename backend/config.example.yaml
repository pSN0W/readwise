# Reading helper backend — config (example with every parameter)
#
# Where it lives: on the GPU machine, NOT in the synced library folder (it holds tokens).
#   default path: ~/.config/reading-helper/config.yaml
#   other path:   RH_CONFIG=/path/to/config.yaml rh ingest …   or   rh --config /path/to/config.yaml …
# Any value can be overridden by an env var: RH__<SECTION>__<KEY>, e.g. RH__LLM__API_KEY=sk-…
# Values shown are the defaults. Keys you leave out keep their default.

# ---------------------------------------------------------------- folders
library_dir: /data/Sync/library          # the Syncthing folder the apps read
work_dir: /data/reading-helper-work       # private: work.db, FAISS index, downloads, logs (never synced)

# ---------------------------------------------------------------- model for cards and merge
llm:
  base_url: http://127.0.0.1:8801/v1      # dev: the mock server (rh mock-server). Real: your GPU box, e.g. http://gpu-box:8000/v1
  api_key: dev                            # real token here or in RH__LLM__API_KEY
  model: mock-cards                       # the model name your server expects
  temperature: 0.2
  max_tokens: 4096                        # answer length limit per call
  timeout_s: 180
  max_retries: 3                          # network / 5xx / timeout retries (LangChain). Not the check retries.
  structured_method: json_schema          # json_schema | function_calling | json_mode — pick what your server supports
  strict: true                            # send strict JSON schema (json_schema method only)
  max_parallel: 2                         # chunks in flight at the same time
  extra_body: {}                          # passed as-is to the server, e.g. {chat_template_kwargs: {enable_thinking: false}}

# ---------------------------------------------------------------- embeddings
embeddings:
  base_url: http://127.0.0.1:8801/v1
  api_key: dev
  model: mock-embed
  batch: 64                               # texts per request
  text: "{what}"                          # what is embedded per card: only the brief description (what)

# ---------------------------------------------------------------- chunking (LangChain RecursiveCharacterTextSplitter)
chunking:
  max_tokens: 4000                        # size of one chunk
  overlap: 0.20                           # share of a chunk repeated in the next one
  tokenizer: chars/4                      # chars/4 (no download) | tiktoken:cl100k_base (downloads once)
  separators: ["\n# ", "\n## ", "\n### ", "\n\n", "\n"]   # never "" or " ": cuts only between lines

# ---------------------------------------------------------------- checks on every chunk answer
checks:
  max_gap_lines: 20                       # largest run of uncovered content lines allowed
  max_description_words: 50               # max words in card description (what); must be concise (< 50 words)
  max_retries: 3                          # model tries per chunk (1 first try + 2 retries) before partial accept
  clamp_lines: 3                          # ranges this far outside the chunk are clamped in code, not retried
  trim_overlap_lines: 3                   # overlaps this small are trimmed in code, not retried
  ignore_sections:                        # headings whose section never counts as a gap (case-insensitive, prefix match)
    - contents
    - table of contents
    - index
    - references
    - bibliography
    - acknowledgements
    - acknowledgments
    - about the author
    - copyright

# ---------------------------------------------------------------- merge
merge:
  threshold: 0.80                         # cosine similarity for a pair to go to the judge
  top_k: 5                                # nearest neighbours looked at per new card (FAISS)
  judge_sees: fields                      # fields | fields+lines   (all card info: title, what, why, how, when, extra)
  overlap_always_judge: true              # rule A: same source + lines overlap or touch → always judged
  touch_gap_lines: 1                      # "touch" = next.start <= prev.end + this

# ---------------------------------------------------------------- topics
topics:
  max_levels: 3
  max_suggestions_per_run: 20

# ---------------------------------------------------------------- converting sources
convert:
  pdf:
    engine: marker                        # marker | pymupdf4llm   (you chose: marker)
    marker:
      use_llm: false                      # marker's own LLM helper: off (we call models only for cards)
      force_ocr: false                    # no OCR for now
      device: cuda                        # cuda | cpu
    min_image_px: 64                      # smaller images are dropped (icons, bullets)
  blog:
    user_agent: "reading-helper/0.1"
    timeout_s: 30
    download_images: true
  video:
    subtitle_langs: [en, en-orig, en-US]  # tried in order; then auto-captions
    asr_fallback: true                    # Whisper when there are no subtitles (you chose: yes)
    whisper_model: large-v3-turbo
    whisper_device: cuda
    slides: false                         # slide images from the video (you did not pick this; set true to try)
    slide_scene_threshold: 27.0           # PySceneDetect ContentDetector threshold (only if slides: true)
    slide_min_gap_s: 10                   # at most one slide per 10 s
    js_runtime: deno                      # yt-dlp needs it (you chose: install deno + yt-dlp-ejs)
    cookies_file: null                    # optional, if YouTube blocks the machine

# ---------------------------------------------------------------- prompts (edit freely; old sources are NOT re-run)
prompts:
  cards: prompts/cards.md                 # relative to this config file's folder, or absolute
  cards_retry: prompts/cards_retry.md
  merge: prompts/merge.md

# ---------------------------------------------------------------- how it runs (you chose: manual)
run:
  convert_all_first: true                 # convert every queued source, then call the model (GPU is not shared at once)
  lock_file: rh.lock                      # in work_dir: two rh commands never run at the same time

watch:                                    # only used by `rh watch`, which you start by hand
  settle_s: 5                             # a file must stop growing for this long
  rescan_s: 60

# ---------------------------------------------------------------- logs
log:
  level: INFO                             # DEBUG shows every prompt and answer (goes to work_dir/logs/, never the library)
