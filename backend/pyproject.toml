[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rh-ingest"
version = "0.1.0"
description = "Reading helper backend ingest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "trafilatura>=2.0.0",
    "watchdog>=4.0.0",
    "jsonschema>=4.20.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
pdf = ["marker-pdf>=1.8"]
pdf-fast = ["pymupdf4llm"]
video = ["yt-dlp[default]", "yt-dlp-ejs", "scenedetect", "opencv-python-headless", "imagehash", "pillow"]
asr = ["faster-whisper>=1.2"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "ruff>=0.4.0",
]

[project.scripts]
rh = "rh_ingest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rh_ingest"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]



[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
